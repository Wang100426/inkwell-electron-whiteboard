<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;" />
  <title>InkWell 白板</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="workspace">
      <!--
        左侧栏（1.2.0）：撤掉原来的横向顶栏，所有功能竖向排成一条线，
        从上到下依次是「应用图标 / 撤销重做 / 缩放 / 绘图工具 / 文件操作」。
        顶部与各部分之间的空隙兼作窗口拖拽区。
      -->
      <aside class="rail" id="rail">
        <!-- 顶部固定区：应用图标 / 撤销重做 / 缩放 -->
        <div class="rail-head">
        <!-- 应用图标 + 未命名白板文件名 -->
        <div class="brand">
          <div class="brand-mark" title="InkWell 白板">
            <img src="../../assets/icon.png" alt="InkWell" />
          </div>
          <span class="brand-sub" id="fileName">未命名白板</span>
        </div>

        <!-- 撤销 / 重做 -->
        <div class="seg">
          <button class="btn-icon" id="btnUndo" title="撤销 (Ctrl+Z)" aria-label="撤销">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.1-5.6L3 10"/></svg>
          </button>
          <button class="btn-icon" id="btnRedo" title="重做 (Ctrl+Y)" aria-label="重做">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M20.5 13a9 9 0 1 1-2.1-5.6L21 10"/></svg>
          </button>
        </div>

        <!-- 缩放 -->
        <div class="seg">
          <button class="btn-icon" id="btnZoomOut" title="缩小 (Ctrl+-)" aria-label="缩小">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <button class="zoom-label" id="zoomLabel" title="点击重置视图 (Ctrl+0)">100%</button>
          <button class="btn-icon" id="btnZoomIn" title="放大 (Ctrl+=)" aria-label="放大">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        </div>

        <!--
          中间区：绘图工具（1.3.0 精简为 4 个按钮）
          选择 / 自由绘画 / 图形 / 文本
          带子工具的分组（自由绘画、图形、文本）点击后向右弹出子弹层选具体工具，
          子弹层收起后主按钮显示"组内当前工具"的图标，一眼能看出当前是什么。
        -->
        <div class="rail-tools" id="railTools">

        <!-- 1. 选择 -->
        <button class="tool tool-group" data-group="select" data-tool="select" title="选择 (V)">
          <span class="tool-face" data-face="select">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l6.5 17 2.2-6.9 7.3-2.1z"/></svg>
          </span>
          <span>选择</span>
        </button>

        <!-- 2. 自由绘画：画笔 / 橡皮 / 抓手 -->
        <button class="tool tool-group" data-group="draw" data-tool="pen" title="自由绘画 (B)" aria-haspopup="true">
          <span class="tool-face" data-face="pen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M14 5l3 3"/></svg>
          </span>
          <span class="caret"></span>
          <span>绘画</span>
        </button>

        <!-- 3. 图形：矩形 / 椭圆 / 直线 / 箭头 / 填充 -->
        <button class="tool tool-group" data-group="shape" data-tool="rect" title="图形 (R)" aria-haspopup="true">
          <span class="tool-face" data-face="rect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
          </span>
          <span class="caret"></span>
          <span>图形</span>
        </button>

        <!-- 4. 文本：文本 / 便签 -->
        <button class="tool tool-group" data-group="text" data-tool="text" title="文本 (T)" aria-haspopup="true">
          <span class="tool-face" data-face="text">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2"/><path d="M12 4v16M9 20h6"/></svg>
          </span>
          <span class="caret"></span>
          <span>文本</span>
        </button>
        </div>

        <!--
          子弹层：分组内具体工具。
          放在 .rail 内部、用绝对定位飘到右侧，避免被 rail-tools 的
          overflow:auto 裁掉（这是它不能放在 rail-tools 里的原因）。
        -->
        <div class="flyout" id="flyout" hidden>
          <div class="flyout-title" id="flyoutTitle">绘图</div>
          <div class="flyout-items" id="flyoutItems"></div>
        </div>

        <!-- 底部固定区：文件与视图操作，只有图标不配文字 -->
        <div class="rail-actions">
          <button class="btn-icon" id="btnGrid" title="网格 (G)" aria-label="网格">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
          </button>
          <button class="btn-icon" id="btnFit" title="适应窗口 (Shift+1)" aria-label="适应窗口">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M20 9V5a1 1 0 0 0-1-1h-4"/><path d="M4 15v4a1 1 0 0 0 1 1h4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
          </button>
          <button class="btn-icon" id="btnExport" title="导出 PNG (Ctrl+Shift+E)" aria-label="导出 PNG">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          </button>
          <button class="btn-icon" id="btnOpen" title="打开 (Ctrl+O)" aria-label="打开">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </button>
          <button class="btn-icon accent" id="btnSave" title="保存 (Ctrl+S)" aria-label="保存">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3M8 21v-6h8v6"/></svg>
          </button>
        </div>
      </aside>

      <!-- 属性面板：设置项随左侧栏当前分组切换 -->
      <aside class="panel" id="panel">
        <!-- 当前分组标题，让面板和左侧栏的分组语义对上 -->
        <div class="panel-head">
          <span class="panel-head-icon" id="panelHeadIcon"></span>
          <span class="panel-head-name" id="panelHeadName">自由绘画</span>
        </div>

        <!-- 选择：只显示位置/删除相关，不显示画笔设置 -->
        <section class="panel-group" id="selectGroup" hidden>
          <p class="hint">框选或点击图形后可拖动、缩放。方向键微调，Shift+方向键加速。</p>
        </section>

        <!-- 颜色（绘画/图形/文本都用；填充工具下变成「填充色」） -->
        <section class="panel-group" id="colorGroup">
          <h4 id="colorLabel">颜色</h4>
          <div class="swatches" id="swatches"></div>
          <div class="color-custom">
            <input type="color" id="colorPicker" value="#e8ecf4" title="自定义颜色" />
            <span id="colorHex">#E8ECF4</span>
          </div>
          <!-- 填充工具专用：清除填充。选中填充工具时出现 -->
          <button class="btn btn-ghost btn-clear-fill" id="btnNoFill" hidden>清除填充</button>
        </section>

        <section class="panel-group" id="widthGroup">
          <h4>线宽 <em id="widthValue">3</em></h4>
          <div class="width-presets" id="widthPresets">
            <button data-w="2"></button>
            <button data-w="4"></button>
            <button data-w="8"></button>
            <button data-w="14"></button>
          </div>
          <input type="range" id="widthRange" min="1" max="40" value="3" />
        </section>

        <section class="panel-group" id="opacityGroup">
          <h4>不透明度 <em id="opacityValue">100%</em></h4>
          <input type="range" id="opacityRange" min="10" max="100" value="100" />
        </section>

        <section class="panel-group" id="pressureGroup">
          <h4>压感 <em id="pressureDevice">未检测到</em></h4>
          <label class="switch">
            <input type="checkbox" id="pressureToggle" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-label">手写笔力度控粗细</span>
          </label>
          <h4 style="margin-top:2px">最粗 <em id="pressureMaxValue">18</em></h4>
          <input type="range" id="pressureMaxRange" min="6" max="60" value="18" />
          <p class="hint" id="pressureHint">用手写笔书写时，笔画粗细随力度变化。鼠标与普通触控板不受影响。</p>
        </section>

        <section class="panel-group" id="textGroup" hidden>
          <h4>字号 <em id="fontSizeValue">20</em></h4>
          <input type="range" id="fontSizeRange" min="10" max="72" value="20" />
        </section>

        <section class="panel-group panel-actions">
          <button class="btn btn-ghost" id="btnDuplicate">复制 (Ctrl+D)</button>
          <div class="btn-row">
            <button class="btn btn-ghost" id="btnRaise" title="上移一层 (Ctrl+])">上移一层</button>
            <button class="btn btn-ghost" id="btnLower" title="下移一层 (Ctrl+[)">下移一层</button>
          </div>
          <button class="btn btn-ghost btn-danger" id="btnDelete">删除 (Del)</button>
          <button class="btn btn-ghost btn-danger" id="btnClear">清空画布</button>
        </section>

        <!--
          原来这里有一个「显示网格」开关。
          1.2.0 起网格改由左侧栏的网格图标切换（工具栏式，图标本身显示开关状态），
          开关与图标同时存在会让人搞不清哪个是主入口，故删除。
        -->
      </aside>

      <!-- 画布 -->
      <main class="stage" id="stage">
        <canvas id="canvas"></canvas>

        <!--
          自绘窗口控制按钮（1.2.0，替代被隐藏的 Windows 原生标题栏）。
          放在 stage 内右上角绝对定位：这样它只在画布区域之上，
          不会盖住左侧栏，也不需要额外的顶层容器。
          no-drag 必须加 —— 父级 .stage 顶部留了拖拽区，
          按钮若不显式排除，点下去会变成拖窗口而不是点按钮。
        -->
        <div class="win-controls no-drag" id="winControls">
          <button class="win-btn" id="btnMinimize" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2.5 6h7"/></svg>
          </button>
          <button class="win-btn" id="btnMaximize" title="最大化" aria-label="最大化">
            <svg class="ico-max" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg>
            <svg class="ico-restore" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" hidden><rect x="2" y="3.5" width="6.5" height="6.5" rx="1"/><path d="M4.2 3.5V2.6a1 1 0 0 1 1-1h3.7a1 1 0 0 1 1 1v3.7a1 1 0 0 1-1 1h-.9"/></svg>
          </button>
          <button class="win-btn danger" id="btnWinClose" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
          </button>
        </div>

        <div class="text-editor" id="textEditor" hidden>
          <textarea id="textInput" placeholder="输入文字，Esc 取消，Ctrl+Enter 确认" spellcheck="false"></textarea>
        </div>
        <div class="empty-hint" id="emptyHint">
          <div class="empty-inner">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>
            <p>在画布上随便画点什么</p>
            <span>按 B 画笔 · R 矩形 · T 文字 · 空格拖拽平移</span>
          </div>
        </div>
        <div class="status-bar" id="statusBar">
          <span id="statusTool">选择</span>
          <span class="dot"></span>
          <span id="statusCount">0 个图形</span>
          <span class="spacer"></span>
          <span id="statusPos">x: 0  y: 0</span>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>

    <!-- 关闭确认（页面内，不用原生模态框） -->
    <div class="modal-mask" id="closeMask" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <h3>白板还有未保存的内容</h3>
        <p>关闭前要先保存吗？</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="closeCancel">取消</button>
          <button class="btn btn-danger-ghost" id="closeDiscard">不保存</button>
          <button class="btn btn-primary" id="closeSave" autofocus>保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
